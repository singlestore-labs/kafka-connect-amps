# AMPS Source Connector Configuration - Standalone Mode

name=amps-source-connector
connector.class=com.singlestore.kafka.connect.amps.AMPSSourceConnector

# Single task for the configured topic
tasks.max=1

# AMPS Connection
amps.uri=tcp://localhost:9007/amps/json
# The URI message-type segment selects the payload (json or nvfix). The connector does not parse it.
amps.client.name=kafka-connect-amps-

# AMPS Topic to subscribe to
amps.topic=

# Optional content filter
amps.filter=

# Subscription type: subscribe | sow_and_subscribe | sow
#   subscribe — bookmark subscription (replay + live)
#   sow_and_subscribe — SOW snapshot then bookmark subscription
#   sow — stream one full SOW snapshot across many polls, then stay idle
amps.subscription.type=subscribe

# Starting position when no offset exists: LATEST or EPOCH
amps.position=EPOCH

# Kafka topic mapping: kafka topic = prefix + amps topic
# e.g., market-ticker -> amps-market-ticker
kafka.topic.prefix=amps-

# Performance settings
batch.size=100
# Optional for sow only: 0 or unset = inherit batch.size
# amps.sow.query.batch.size=100
# Cap while waiting for the first AMPS record (empty polls wait this long).
poll.timeout.ms=1000
# After the first record, return when AMPS has been quiet this long (or sooner if batch.size is hit).
poll.idle.ms=200

# --- Authentication (optional) ---
# amps.auth.type: NONE | PASSWORD | KERBEROS_GSSAPI (default: NONE)
amps.auth.type=NONE

# Password-based auth (works with AMPS server-side LDAP, file/htpasswd, or any password module).
# Use a Kafka Connect ConfigProvider (e.g. ${file:/path:amps_password}) to keep secrets out of plaintext.
# amps.auth.type=PASSWORD
# amps.username=alice
# amps.password=changeme

# Kerberos (GSSAPI) auth via the vendored 60East AMPSKerberosGSSAPIAuthenticator.
# Either set amps.kerberos.jaas.config to a JAAS file, OR omit it and set keytab + principal
# (connector materializes JAAS from bundled template jaas/amps-keytab-jaas.template).
# amps.auth.type=KERBEROS_GSSAPI
# amps.kerberos.spn=AMPS/amps-host.example.com
# amps.kerberos.jaas.entry=AMPSClient
# amps.kerberos.jaas.config=/etc/kafka-connect/amps-jaas.conf
# amps.kerberos.lifetime.seconds=28800
#
# Keytab-only (no amps.kerberos.jaas.config):
# amps.kerberos.keytab=/etc/kafka-connect/connector.keytab
# amps.kerberos.client.principal=kafka-connect@CORP.EXAMPLE.COM
